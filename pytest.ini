[pytest]
pythonpath = .
testpaths = tests
norecursedirs = backups data venv .pytest_cache chroma chromadb images
addopts = -ra --strict-markers --ignore=backups
markers =
    fast: fast unit tests that do not require external LLM inference
    integration: tests that perform multi-step ingestion or local retrieval
    llm: tests that invoke Ollama or Gemini models
